name: update-feed

on:
  schedule:
    # 21:50 UTC = 06:50 JST。取得窓は「前日0:00〜当日0:00(日本時間)」= 昨日1日分。
    # 暦日で固定されるため、cronが数分遅れても窓は変わらない
    - cron: "50 21 * * *"
  workflow_dispatch:
    inputs:
      window_start:
        description: "取得窓の開始時刻(ISO8601 UTC、例: 2026-09-15T00:00:00Z)。空なら昨日1日分(前日0:00〜当日0:00 JST)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          WINDOW_START: ${{ inputs.window_start }}
        run: |
          if [ -n "$WINDOW_START" ]; then
            python scripts/build_feed.py --window-start "$WINDOW_START"
          else
            python scripts/build_feed.py
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss/copilot.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update feed (run $GITHUB_RUN_ID)"
          git push
